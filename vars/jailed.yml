---
# Add users here
ssh_jailed_users: ["max", "mellanie"]
# Passwörter: zusammengesetzt aus Bausteinen, z.B. "maxStart482#".
# Zahl und Sonderzeichen sind hier pro Person zufällig (sonst wäre das Schema
# aus diesem öffentlichen Repo erratbar). Feste Werte: jail_password_number: "2026",
# jail_password_special: "!". Zufallspasswort statt Schema: jail_password_mode: "random".
# Alle Optionen: roles/docker-jail/defaults/main.yml. Klartext danach in ./credentials/<user>.
jail_password_mode: "pattern"
jail_password_pattern: ["user", "suffix", "number", "special"]
jail_password_suffix: "Start"
jail_password_number: ""
jail_password_special: ""

# Zusätzliche (schreibgeschützte) Mounts für die Schnitzeljagd aus dem
# Repo workshop_exercise. Fehlende Quellen werden beim Login übersprungen.
jail_extra_mounts:
  - /etc/quallenfischen:/etc/quallenfischen:ro
  - /home/plankton:/home/plankton:ro
