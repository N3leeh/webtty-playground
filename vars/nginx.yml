---
# file: nginx.yml
#
# Zugriff über den Browser mit der IP-Adresse des Servers, z.B. http://203.0.113.10
# (nginx nimmt die Anfrage an und leitet sie an wetty weiter, wetty meldet
# sich per SSH am Server an).

# "selfsigned": http://<IP> leitet auf https://<IP> um. Selbstsigniertes
#               Zertifikat für die IP - der Browser warnt beim ersten Aufruf
#               einmal ("Risiko akzeptieren"), danach ist die Verbindung
#               verschlüsselt. Empfohlen.
# "none":       Nur http://<IP>, ohne Verschlüsselung. Einfacher (keine
#               Browser-Warnung), aber Passwörter gehen im Klartext über das
#               Internet.
webtty_tls: "selfsigned"

# Optional: zusätzliches gemeinsames Workshop-Passwort VOR der Login-Seite
# (Browser-Anmeldedialog). Hält Scanner und Neugierige aus dem Internet von
# der Login-Seite fern. Benutzer: webtty_basic_auth_user, Passwort wird
# zufällig erzeugt und liegt in credentials/web-zugang (erste Spalte).
webtty_basic_auth: false
webtty_basic_auth_user: "workshop"

# Optional: Zugriff nur aus bestimmten Netzen erlauben, z.B. dem Uni-Netz.
# Leer = keine Einschränkung.
#   webtty_allowed_networks: ["192.0.2.0/24", "2001:db8::/32"]
webtty_allowed_networks: []

# Debian-Default-Site entfernen ("Welcome to nginx" auf Port 80)
nginx_remove_default_vhost: true

# --- ab hier normalerweise nichts ändern --------------------------------------

webtty_proxy_location: |
  location / {
  {% if webtty_basic_auth | bool %}
    auth_basic "Linux-Workshop";
    auth_basic_user_file /etc/webtty.htpasswd;
  {% endif %}
  {% for net in webtty_allowed_networks %}
    allow {{ net }};
  {% endfor %}
  {% if webtty_allowed_networks | length > 0 %}
    deny all;
  {% endif %}
    proxy_pass http://{{ webtty_bind_ip }}:3000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # offene Terminal-Sitzungen bis zu 12 Stunden
    proxy_read_timeout 43200;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    # wetty prüft bei JEDER Anfrage den Origin-Header. Browser schicken ihn bei
    # gewöhnlichen GET-Anfragen auf dieselbe Seite aber nicht mit (socket.io
    # startet so) -> "origin not allowed", keine Login-Abfrage. Fehlt der Header,
    # setzen wir ihn auf die aufgerufene Adresse. Ein mitgeschickter Origin
    # (z.B. von einer fremden Seite) bleibt unverändert und wird weiter geprüft.
    set $webtty_origin $http_origin;
    if ($webtty_origin = "") {
      set $webtty_origin "$scheme://$host";
    }
    proxy_set_header Origin $webtty_origin;
  }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

webtty_vhost_redirect:
  listen: "80 default_server"
  server_name: "_"
  filename: "webtty.80.conf"
  state: "present"
  extra_parameters: |
    return 301 https://$host$request_uri;

webtty_vhost_http:
  listen: "80 default_server"
  server_name: "_"
  filename: "webtty.80.conf"
  state: "present"
  extra_parameters: "{{ webtty_proxy_location }}"

webtty_vhost_https:
  listen: "443 ssl default_server"
  server_name: "_"
  filename: "webtty.443.conf"
  state: "{{ 'present' if webtty_tls == 'selfsigned' else 'absent' }}"
  extra_parameters: |
    {{ webtty_proxy_location }}
    ssl_certificate     /etc/ssl/certs/certificate.pem;
    ssl_certificate_key /etc/ssl/private/ca_certificate.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

nginx_vhosts: >-
  {{ [webtty_vhost_redirect if webtty_tls == 'selfsigned' else webtty_vhost_http,
      webtty_vhost_https] }}
