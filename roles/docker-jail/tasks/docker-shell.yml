---
- name: Ensure jailed group exits
  ansible.builtin.group:
    name: jailed
    state: present

- name: Ensure jailed users exists
  ansible.builtin.user:
    name: "{{ item }}"
    group: "jailed"
    #groups: ["jailed"]
    state: present
    shell: "/bin/bash"
    # Ablauf nach jail_account_lifetime_hours (Default 48h), tagesgenau
    expires: "{{ (ansible_date_time.epoch | int) + (jail_account_lifetime_hours | int * 3600) }}"
    # Standard: Zufallspasswort pro User, Klartext liegt auf dem Controller in
    # jail_credentials_dir/<user> (erste Spalte). Der Salt wird dort ebenfalls
    # gespeichert, dadurch bleibt der Hash bei jedem Lauf gleich (idempotent).
    # Legacy: initial_password_suffix gesetzt -> "<user><suffix>".
    password: >-
      {{
        (item + initial_password_suffix) | password_hash('sha512', (item | hash('sha256'))[:16])
        if (initial_password_suffix | length > 0) else
        lookup('ansible.builtin.password', jail_credentials_dir ~ '/' ~ item,
               length=jail_password_length, chars=['ascii_letters', 'digits'],
               encrypt='sha512_crypt')
      }}
  with_items: "{{ ssh_jailed_users }}"
  when: (ssh_jailed_users|length>0)
  no_log: true

- name: "Users should belong to jailed group"
  ansible.builtin.user:
    name: "{{ item }}"
    groups: jailed
    append: yes
  with_items: "{{ ssh_jailed_users }}"
  when: (ssh_jailed_users|length>0)

- name: Ensure all jailed users belong to unprivileged groups
  ansible.builtin.include_tasks: remove-groups.yml
  with_items: "{{ ssh_jailed_users }}"
  when: (ssh_jailed_users|length>0)

- name: Build jailed container
  community.docker.docker_image:
    build:
      path: "{{ role_path }}/files/"
    debug: true
    name: debian-jail
    tag: latest
    source: build
    force_tag: true

- name: Ensure docker network for jail containers exists
  community.docker.docker_network:
    name: "{{ jail_network }}"
    internal: "{{ jail_network_internal | bool }}"
    driver_options:
      # Container dürfen sich nicht gegenseitig erreichen
      com.docker.network.bridge.enable_icc: "false"
    state: present
  when: jail_network | length > 0

- name: Create /usr/local/containerize.sh from template
  ansible.builtin.template:
    src: containerize.sh.j2
    dest: /usr/local/containerize.sh
    owner: root
    group: root
    mode: '0755'

- name: Copy files/wsadm to /usr/local/bin/
  ansible.builtin.copy:
    src: files/wsadm
    dest: /usr/local/bin/wsadm
    owner: root
    group: root
    mode: '0755'

- name: Ensure sudo is installed
  ansible.builtin.package:
    name: sudo
    state: present

- name: Allow password-less sudo on /usr/local/containerize.sh for jailed users
  ansible.builtin.lineinfile:
    dest: /etc/sudoers
    state: present
    regexp: '^%jailed ALL=(ALL) NOPASSWD: /usr/local/containerize.sh'
    line: '%jailed ALL=(ALL) NOPASSWD: /usr/local/containerize.sh'
    validate: 'visudo -cf %s'

- name: Insert/Update Match Group in /etc/ssh/sshd_config
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    insertafter: EOF
    block: |
      Match Group jailed
            ForceCommand sudo /usr/local/containerize.sh
            AllowTcpForwarding no
            PermitTunnel no
            X11Forwarding no
      Match All
  notify: restart sshd
