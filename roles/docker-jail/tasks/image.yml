---
# file: image.yml

- name: Build jailed container
  community.docker.docker_image:
    build:
      path: "{{ role_path }}/files/"
    debug: true
    name: debian-jail
    tag: latest
    source: build
    # Bei jedem Lauf neu bauen, damit Änderungen am Dockerfile ankommen.
    # Dank Build-Cache schnell; unverändertes Image -> kein "changed".
    force_source: true
    force_tag: true
