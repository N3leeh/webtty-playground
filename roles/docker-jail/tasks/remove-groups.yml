---
# file: remove-groups.yml
#
# Entfernt Teilnehmende aus privilegierten Gruppen. Vorher wurde das Ergebnis
# von ansible.builtin.user ausgewertet; dieses enthält aber kein Feld
# "groups", wenn groups nicht gesetzt ist - die Prüfung griff daher nie.

- name: Lookup groups of {{ item }}
  ansible.builtin.command: "id -nG {{ item }}"
  register: user_groups
  changed_when: false
  check_mode: false

- name: Remove {{ item }} from privileged groups
  ansible.builtin.command: "gpasswd -d {{ item }} {{ privileged_group }}"
  loop: "{{ jail_privileged_groups }}"
  loop_control:
    loop_var: privileged_group
  when: privileged_group in user_groups.stdout.split()
