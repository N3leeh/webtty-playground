---
# Liste der Workshop-Teilnehmenden (Login-Namen)
ssh_jailed_users: []

# --- Passwörter -------------------------------------------------------------
# Das Klartext-Passwort jedes Users liegt nach dem Lauf auf dem
# Ansible-Controller unter "{{ jail_credentials_dir }}/<user>" (erste Spalte),
# das Verzeichnis ist per .gitignore ausgeschlossen.
jail_credentials_dir: "{{ playbook_dir }}/credentials"

# "random":  Zufallspasswort (jail_password_length Zeichen)
# "pattern": aus Bausteinen zusammengesetzt (jail_password_pattern)
jail_password_mode: "random"
jail_password_length: 12

# Bausteine in dieser Reihenfolge. Bekannte Namen:
#   user     -> Login-Name (z.B. max)
#   User     -> Login-Name mit großem Anfangsbuchstaben (z.B. Max)
#   suffix   -> jail_password_suffix
#   number   -> jail_password_number (oder zufällig, s.u.)
#   special  -> jail_password_special (oder zufällig, s.u.)
# Alles andere wird wörtlich übernommen, z.B. ["User", "-", "number"].
jail_password_pattern: ["user", "suffix", "number", "special"]
jail_password_suffix: "Start"
# Feste Zahl, z.B. "2026". Leer = pro User zufällig mit
# jail_password_number_digits Stellen (bleibt bei weiteren Läufen gleich).
jail_password_number: ""
jail_password_number_digits: 3
# Festes Sonderzeichen, z.B. "!". Leer = pro User zufällig aus
# jail_password_special_chars (bleibt bei weiteren Läufen gleich).
jail_password_special: ""
jail_password_special_chars: "!?#+-.@"

# Veraltet: gesetzt = Schema "<user><suffix>" (entspricht mode "pattern"
# mit pattern ["user", "suffix"]).
initial_password_suffix: ""

# Wie lange die Accounts gültig sind (Stunden ab dem Playbook-Lauf).
# Hinweis: /etc/shadow speichert das Ablaufdatum tagesgenau.
jail_account_lifetime_hours: 48

# Zusätzliche Gruppen der Teilnehmenden (Primärgruppe ist jailed).
# "users" wird im Jail-Image für sudo (%users) und für die Dateien der
# Schnitzeljagd gebraucht.
jail_user_extra_groups: ['users']

# Aus diesen Gruppen werden Teilnehmende entfernt (Root-Zugriff auf den Host)
jail_privileged_groups: ['docker', 'sudo', 'wheel', 'adm', 'lxd']

# --- Login-Nachricht ----------------------------------------------------------
# Wird bei jedem interaktiven Login vor dem Start des Containers angezeigt.
# "@USER@" wird durch den Login-Namen ersetzt. "" = keine Nachricht.
jail_motd_template: "workshop-motd.j2"

# --- SSH ----------------------------------------------------------------------
# Teilnehmende dürfen sich nur aus diesem Netz per Passwort anmelden (dort
# läuft wetty). "" = automatisch das Subnetz der Docker-Standard-Bridge
# (meist 172.17.0.0/16). Von überall sonst ist für sie kein Login möglich.
jail_wetty_subnet_override: ""

# Maximale Anzahl gleichzeitiger Sitzungen (Container) pro Person, damit
# niemand mit vielen Browser-Tabs den Server für alle belegt. 0 = unbegrenzt.
jail_max_sessions_per_user: 3

# --- Container --------------------------------------------------------------
jail_image: "debian-jail:latest"

# Eigenes Docker-Netz für die Jail-Container. "" = Docker-Standard-Bridge.
jail_network: "workshop-jail"
# true = kein Zugriff nach außen (kein Internet, kein apt im Container)
jail_network_internal: true

# Ressourcenlimits pro Sitzung. 0 bzw. "" = kein Limit.
jail_pids_limit: 256
jail_memory: "512m"
jail_cpus: "1"

# Alle Linux-Capabilities entfernen und nur die nötigen wieder hinzufügen.
# Die Liste reicht für sudo, sudo -u, chown, chmod und kill.
# Falls im Workshop etwas mit "Operation not permitted" scheitert, hier die
# fehlende Capability ergänzen oder jail_cap_drop_all auf false setzen.
jail_cap_drop_all: true
jail_capabilities:
  - CHOWN
  - DAC_OVERRIDE
  - DAC_READ_SEARCH
  - FOWNER
  - FSETID
  - KILL
  - SETGID
  - SETUID
  - AUDIT_WRITE

# Zusätzliche Bind-Mounts im Docker-Format "quelle:ziel[:optionen]".
# Mounts, deren Quelle auf dem Host (noch) nicht existiert, werden beim
# Login übersprungen. Pfade dürfen keine Leerzeichen enthalten.
jail_extra_mounts: []
