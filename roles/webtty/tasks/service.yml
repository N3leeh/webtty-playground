---
# file: service.yml

- name: Get infos on network
  community.docker.docker_network_info:
    name: bridge
  register: docker_bridge

- name: Gateway-IP der Docker-Bridge bestimmen (dort lauscht wetty, dort lauscht sshd)
  ansible.builtin.set_fact:
    webtty_bind_ip: >-
      {{ (docker_bridge.network.IPAM.Config
          | selectattr('Gateway', 'defined')
          | map(attribute='Gateway')
          | select('match', '^[0-9.]+$')
          | first) | default('172.17.0.1') }}

- name: Erlaubte Origins für wetty festlegen (Adresse im Browser)
  ansible.builtin.set_fact:
    webtty_origins: >-
      {{ webtty_allowed_origins if webtty_allowed_origins | length > 0 else
         (['http://' + ansible_default_ipv4.address, 'https://' + ansible_default_ipv4.address]
          if ansible_default_ipv4.address is defined else [])
         + (['http://[' + ansible_default_ipv6.address + ']', 'https://[' + ansible_default_ipv6.address + ']']
            if ansible_default_ipv6.address is defined else []) }}

- name: Ohne Origin startet wetty nicht
  ansible.builtin.assert:
    that: webtty_origins | length > 0
    fail_msg: "Keine öffentliche IP gefunden - bitte webtty_allowed_origins in roles/webtty/defaults/main.yml setzen."

- name: wetty-Image beim Ausrollen ziehen (nicht erst beim Dienststart)
  community.docker.docker_image:
    name: "{{ webtty_image }}"
    source: pull
  register: webtty_image_pull

- name: Create Webtty systemd service file
  ansible.builtin.template:
    src: templates/webtty.service.j2
    dest: /etc/systemd/system/webtty.service
    mode: '0644'
  register: webtty_unit

- name: Enable Webtty unit
  ansible.builtin.systemd_service:
    name: webtty
    # bei geänderter Unit-Datei oder neuem Image neu starten
    state: "{{ 'restarted' if (webtty_unit is changed or webtty_image_pull is changed) else 'started' }}"
    enabled: true
    daemon_reload: true

- name: Warten, bis wetty auf der Docker-Bridge antwortet
  ansible.builtin.uri:
    url: "http://{{ webtty_bind_ip }}:3000/"
    status_code: 200
  register: webtty_up
  retries: 12
  delay: 5
  until: webtty_up.status == 200
